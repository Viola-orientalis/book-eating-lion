services:
  mysql:
    image: mysql:8.0
    container_name: book_eating_lion_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: database
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 3s
      timeout: 2s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: book_eating_lion_backend
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Seoul
      - DB_PRIMARY_HOST=mysql
      - DB_REPLICA_HOST=mysql
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - DB_NAME=database
      - FRONTEND_URL=http://localhost:5173
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,https://ajttk.com,https://api.ajttk.com
    volumes:
      - ~/.aws:/root/.aws:ro
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8080"
    container_name: book_eating_lion_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
